server:
  port: 51400
  shutdown: graceful  # Espera a que los requests en vuelo terminen antes de cerrar
  servlet:
    context-path: /api/v1  # Base path de todos los endpoints del servicio

spring:
  application:
    name: booking-service
  boot:
    version: 4.0.3

  datasource:
    url: jdbc:postgresql://localhost:5432/bookingdb
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:50003 # URL de tu auth-service

          jwk-set-uri: http://localhost:50003/oauth2/jwks

  jackson:
    mapper:
      # Permite enviar categorías en cualquier case: "electronics", "ELECTRONICS", "Electronics"
      accept-case-insensitive-enums: true
services:
  movie-service:
    url: http://localhost:51100/api/v1

management:
  endpoints:
    web:
      exposure:
        # health: estado del servicio (UP/DOWN)
        # info: información del servicio (nombre, versión)
        # En módulos posteriores se agregarán: metrics, prometheus, env
        include: health, info
  endpoint:
    health:
      show-details: always

# ── OpenAPI / Swagger UI ────────────────────────────────────────────────────
# Demuestra: objetos anidados (CreateOrderRequest → List<OrderItemRequest>)
# y máquina de estados documentada (OrderStatus: PENDING/CONFIRMED/CANCELLED)
# Swagger UI: http://localhost:50300/api/v1/swagger-ui.html
# OpenAPI JSON spec: http://localhost:50300/api/v1/v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: true

logging:
  level:
    com.rvmsoft.moviebooking: DEBUG